@if (variant() === 'full') {
  <svg
    class="nx-logo nx-logo--full"
    [class.nx-logo--inverse]="inverse()"
    viewBox="0 0 1010 172"
    role="img"
    aria-labelledby="nx-logo-title"
  >
    <title id="nx-logo-title">Wisla</title>
    <rect class="nx-logo__ring-a" x="13.25" y="54.25" width="116.5" height="95.5" rx="47.75" />
    <rect class="nx-logo__ring-b" x="87.25" y="54.25" width="116.5" height="95.5" rx="47.75" />
    <text class="nx-logo__word-ar" x="308" y="125">وِصْلة</text>
    <text class="nx-logo__word-en" x="663" y="125">Wisla</text>
  </svg>
} @else {
  <svg
    class="nx-logo nx-logo--icon"
    [class.nx-logo--inverse]="inverse()"
    viewBox="0 0 217 122"
    role="img"
    aria-labelledby="nx-icon-title"
  >
    <title id="nx-icon-title">Wisla</title>
    <rect class="nx-logo__ring-a" x="13.25" y="13.25" width="116.5" height="95.5" rx="47.75" />
    <rect class="nx-logo__ring-b" x="87.25" y="13.25" width="116.5" height="95.5" rx="47.75" />
  </svg>
}
