@if (variant() === 'full') {
  <svg
    class="nx-logo nx-logo--full"
    [class.nx-logo--inverse]="inverse()"
    viewBox="0 0 306 68"
    role="img"
    aria-labelledby="nx-logo-title"
  >
    <title id="nx-logo-title">MADAD</title>
    <rect class="nx-logo__mark-a" x="4" y="8" width="40" height="40" rx="11" />
    <rect class="nx-logo__mark-b" x="20" y="24" width="40" height="40" rx="11" />
    <text class="nx-logo__word-en" x="76" y="36" dominant-baseline="central">MADAD</text>
    <text class="nx-logo__word-ar" x="241" y="37" dominant-baseline="central">مَدَد</text>
  </svg>
} @else {
  <svg
    class="nx-logo nx-logo--icon"
    [class.nx-logo--inverse]="inverse()"
    viewBox="0 0 66 70"
    role="img"
    aria-labelledby="nx-icon-title"
  >
    <title id="nx-icon-title">MADAD</title>
    <rect class="nx-logo__mark-a" x="4" y="8" width="40" height="40" rx="11" />
    <rect class="nx-logo__mark-b" x="20" y="24" width="40" height="40" rx="11" />
  </svg>
}
