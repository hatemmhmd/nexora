@if (variant() === 'full') {
  <svg
    class="nx-logo nx-logo--full"
    [class.nx-logo--inverse]="inverse()"
    viewBox="0 0 960 184"
    role="img"
    aria-labelledby="nx-logo-title"
  >
    <title id="nx-logo-title">Yusra</title>
    <text class="nx-logo__word-ar" x="0" y="136">يُسرى</text>
    <text class="nx-logo__word-en" x="439" y="136">YUSRA</text>
  </svg>
} @else {
  <svg
    class="nx-logo nx-logo--icon"
    [class.nx-logo--inverse]="inverse()"
    viewBox="0 0 100 100"
    role="img"
    aria-labelledby="nx-icon-title"
  >
    <title id="nx-icon-title">Yusra</title>
    <text class="nx-logo__word-en nx-logo__monogram" x="50" y="78" text-anchor="middle">Y</text>
  </svg>
}
