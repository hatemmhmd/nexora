<header class="nx-header" [class.is-scrolled]="isScrolled()" [class.is-menu-open]="isMobileMenuOpen()">
  <div class="nx-header__bar nx-container">
    <a routerLink="/" class="nx-header__logo" (click)="closeMobileMenu()">
      <app-logo-mark />
    </a>

    <div class="nx-header__actions">
      <app-language-switcher class="nx-header__lang" [compact]="true" />
      <button
        type="button"
        class="nx-header__burger"
        [class.is-open]="isMobileMenuOpen()"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="isMobileMenuOpen()"
        aria-controls="nx-mobile-menu"
        aria-label="Toggle menu"
      >
        <span class="nx-header__burger-icon">
          <span class="nx-header__burger-line"></span>
          <span class="nx-header__burger-line"></span>
          <span class="nx-header__burger-line"></span>
        </span>
      </button>
    </div>
  </div>
</header>

<app-mobile-menu [open]="isMobileMenuOpen()" (closed)="closeMobileMenu()" />
