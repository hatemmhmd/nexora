<div class="nx-lang-switch" [class.nx-lang-switch--compact]="compact()" role="group" aria-label="Language">
  <button
    type="button"
    class="nx-lang-switch__option"
    [class.is-active]="lang.currentLang() === 'en'"
    (click)="lang.setLanguage('en')"
    aria-label="Switch to English"
  >
    EN
  </button>
  <button
    type="button"
    class="nx-lang-switch__option"
    [class.is-active]="lang.currentLang() === 'ar'"
    (click)="lang.setLanguage('ar')"
    aria-label="التبديل إلى العربية"
  >
    AR
  </button>
  <button
    type="button"
    class="nx-lang-switch__option"
    [class.is-active]="lang.currentLang() === 'ur'"
    (click)="lang.setLanguage('ur')"
    aria-label="اردو میں تبدیل کریں"
  >
    UR
  </button>
</div>
