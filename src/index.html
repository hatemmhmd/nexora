<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>NEXORA — One Contact. Any Service.</title>
  <meta name="description" content="NEXORA connects clients with the right professionals and manages every service from request to delivery — one contact, any service.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Poppins:wght@400;500;600;700;800&family=Markazi+Text:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Almarai:wght@400;500;700;800&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Applied before Angular boots so there is no flash of the wrong theme.
    // ThemeService reads/writes the same "nexora-theme" key and stays in sync.
    (function () {
      try {
        var stored = localStorage.getItem('nexora-theme');
        var theme = stored === 'dark' || stored === 'light'
          ? stored
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body class="lang-en">
  <app-root></app-root>
</body>
</html>
